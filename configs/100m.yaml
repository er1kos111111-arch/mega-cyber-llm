# MEGA-CYBER LLM — 100M configuration (~96.5M params)
name: mc-llm-100m

model:
  vocab_size: 32768
  hidden_size: 512
  num_layers: 16
  num_attention_heads: 8
  num_kv_heads: 4
  intermediate_size: 2048
  max_position_embeddings: 2048
  rope_theta: 10000.0
  rms_norm_eps: 1e-5
  dropout: 0.0
  tie_word_embeddings: false
  use_bias: false
  dtype: bfloat16

training:
  global_batch_size: 524288
  micro_batch_size: 16
  sequence_length: 2048
  learning_rate: 3.0e-4
  min_learning_rate: 3.0e-5
  optimizer: adamw
  scheduler: warmup_cosine
  weight_decay: 0.1
  betas: [0.9, 0.95]
  eps: 1.0e-8
  warmup_steps: 2000
  max_steps: 50000
  gradient_clip: 1.0
  gradient_accumulation_steps: 16
  dtype: bfloat16
  log_interval: 10
  eval_interval: 500
  save_interval: 1000
  seed: 42

distributed:
  tensor_parallel: 1
  pipeline_parallel: 1
  data_parallel: 1
  sequence_parallel: false
  fsdp: false
  use_gradient_checkpointing: false
  backend: nccl

data_dir: data/shards
out_dir: checkpoints
tokenizer_path: tokenizer/tokenizer_config.json
