# MEGA-CYBER LLM — 800B target configuration (~812.6B params)
#
# NOTE: this config describes the *target* architecture. It is NOT meant to
# run on a single machine.  See docs/SCALING_TO_800B.md and
# scripts/estimate_800b.py for the required TPU/GPU cluster sizing.
name: mc-llm-800b

model:
  vocab_size: 256000
  hidden_size: 20480
  num_layers: 170
  num_attention_heads: 128
  num_kv_heads: 16
  intermediate_size: 61440
  max_position_embeddings: 131072
  rope_theta: 10000000.0
  rms_norm_eps: 1e-5
  dropout: 0.0
  tie_word_embeddings: false
  use_bias: false
  dtype: bfloat16

training:
  global_batch_size: 33554432
  micro_batch_size: 1
  sequence_length: 8192
  learning_rate: 1.0e-4
  min_learning_rate: 1.0e-5
  optimizer: adamw
  scheduler: warmup_cosine
  weight_decay: 0.1
  betas: [0.9, 0.95]
  eps: 1.0e-8
  warmup_steps: 2000
  max_steps: 1000000
  gradient_clip: 1.0
  gradient_accumulation_steps: 4096
  dtype: bfloat16
  log_interval: 10
  eval_interval: 500
  save_interval: 1000
  seed: 42

distributed:
  tensor_parallel: 16
  pipeline_parallel: 32
  data_parallel: 512
  sequence_parallel: true
  fsdp: true
  use_gradient_checkpointing: true
  backend: nccl

data_dir: data/shards
out_dir: checkpoints
tokenizer_path: tokenizer/tokenizer_config.json
