# MEGA-CYBER LLM — local demo config (CPU smoke run).
# This is NOT a real model size; it exists only to prove the end-to-end
# pipeline (tokenizer -> data -> train -> checkpoint -> generate) runs
# correctly on a laptop.  Real training uses configs/100m.yaml and larger.
name: mc-llm-demo

model:
  vocab_size: 748
  hidden_size: 64
  num_layers: 4
  num_attention_heads: 4
  num_kv_heads: 2
  intermediate_size: 192
  max_position_embeddings: 128
  rope_theta: 10000.0
  rms_norm_eps: 1e-5
  dropout: 0.0
  tie_word_embeddings: false
  use_bias: false
  dtype: float32

training:
  global_batch_size: 512
  micro_batch_size: 4
  sequence_length: 128
  learning_rate: 3.0e-3
  min_learning_rate: 3.0e-4
  optimizer: adamw
  scheduler: warmup_cosine
  weight_decay: 0.1
  betas: [0.9, 0.95]
  eps: 1.0e-8
  warmup_steps: 5
  max_steps: 60
  gradient_clip: 1.0
  gradient_accumulation_steps: 1
  dtype: float32
  log_interval: 10
  eval_interval: 20
  save_interval: 20
  seed: 42

distributed:
  tensor_parallel: 1
  pipeline_parallel: 1
  data_parallel: 1
  sequence_parallel: false
  fsdp: false
  use_gradient_checkpointing: false
  backend: gloo

data_dir: data/shards
out_dir: checkpoints
tokenizer_path: tokenizer/tokenizer_config.json
