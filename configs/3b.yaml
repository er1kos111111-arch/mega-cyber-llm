# MEGA-CYBER LLM — 3B configuration (~3.2B params)
name: mc-llm-3b

model:
  vocab_size: 32768
  hidden_size: 2560
  num_layers: 32
  num_attention_heads: 32
  num_kv_heads: 8
  intermediate_size: 10240
  max_position_embeddings: 8192
  rope_theta: 10000.0
  rms_norm_eps: 1e-5
  dropout: 0.0
  tie_word_embeddings: false
  use_bias: false
  dtype: bfloat16

training:
  global_batch_size: 4194304
  micro_batch_size: 4
  sequence_length: 4096
  learning_rate: 2.5e-4
  min_learning_rate: 2.5e-5
  optimizer: adamw
  scheduler: warmup_cosine
  weight_decay: 0.1
  betas: [0.9, 0.95]
  eps: 1.0e-8
  warmup_steps: 2000
  max_steps: 300000
  gradient_clip: 1.0
  gradient_accumulation_steps: 256
  dtype: bfloat16
  log_interval: 10
  eval_interval: 500
  save_interval: 1000
  seed: 42

distributed:
  tensor_parallel: 1
  pipeline_parallel: 1
  data_parallel: 32
  sequence_parallel: false
  fsdp: true
  use_gradient_checkpointing: true
  backend: nccl

data_dir: data/shards
out_dir: checkpoints
tokenizer_path: tokenizer/tokenizer_config.json
